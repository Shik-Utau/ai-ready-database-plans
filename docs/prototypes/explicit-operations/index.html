const Cases=[{label:'使用已有记录',title:'找到结构，加上备注，再导出',note:'库中预先放入 1 条演示记录；不代表查询会自动导入。',intro:'先查找硅的已有结果，再给记录加备注，最后下载结构文件。',steps:[['QUERY','查找 Si 记录'],['NOTE','选择一条备注'],['EXPORT','导出结构文件']]},{label:'保存已有计算结果',title:'先保存，再查询',note:'从空的演示库开始；工作区已有 Si 计算结果。',intro:'这份计算结果还没入库。点击“保存已有计算结果”后再查询，就能找到它。',steps:[['IMPORT','保存已有计算结果'],['QUERY','查询刚保存的记录'],['NOTE','选择一条备注'],['EXPORT','导出结构文件']]}];
const Requests={QUERY:'查一下硅的已有结果。',NOTE:'给这条记录加个备注。',EXPORT:'导出这条记录的结构。',IMPORT:'把工作区已有的 Si 计算结果存入 AIDB。',DELETE:'删除这条记录。'};
function initial(index=0){return {index,guide:0,view:'chat',records:index?[]:structuredClone(E.snapshots.imported),selected:null,queryCount:null,files:[],messages:[],last:'等待操作',steps:[],pendingDelete:false};}

function transition(prev,action,value){const s=structuredClone(prev),say=(text,card)=>s.messages.push({role:'assistant',text,card}),done=(title,steps)=>{s.last=title;s.steps=steps;},row=()=>s.records.find(r=>r.record_id===s.selected);s.view='chat';if(Requests[action])s.messages.push({role:'user',text:Requests[action]});
 if(action==='SELECT'){s.selected=s.records[0]?.record_id||null;done('已选择记录',['从记录列表选择 Si']);say('已选中 Si 记录。','record');}
 if(action==='QUERY'){s.queryCount=s.records.length;s.selected=s.records[0]?.record_id||null;done('查询完成',['按 Si 查询已有记录',`返回 ${s.queryCount} 条；没有写入数据库`]);say(s.queryCount?'找到 1 条 Si 记录，已作为当前操作对象。':'还没有 Si 记录。可以先保存工作区已有的计算结果。',s.queryCount?'record':null);}
 if(action==='IMPORT'){if(s.records.length){done('记录已存在',['识别到同一份演示结果','本次未重复写入']);say('这份演示结果已经在库中，可以直接查询。');}else{s.records=structuredClone(E.snapshots.imported);done('保存完成',['读取工作区已有 VASP 结果','将 Si 记录加入演示库']);say('Si 结果已保存。现在可以查询它。');}}
 if(['NOTE','EXPORT','DELETE','SAVE_NOTE','CONFIRM_DELETE'].includes(action)&&!row()){say('先查询并选择一条记录。');done('等待选择记录',['本次未修改记录或生成文件']);return s;}
 if(action==='NOTE'){say('选一句备注，保存到当前记录。','note');done('选择备注',['等待选择备注内容']);}

const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state=initial();
function recordCard(){const r=state.records.find(r=>r.record_id===state.selected)||state.records[0];if(!r)return '<p class="muted">当前没有记录。</p>';return `<div class="result"><div class="row spread"><strong class="formula">Si</strong><span class="tag">VASP · 弛豫结果</span></div><div class="metrics"><div class="metric"><strong>${r.nsites}</strong><span>原子数</span></div><div class="metric"><strong>${Number(r.energy_per_atom).toFixed(3)}</strong><span>能量 / eV·atom⁻¹</span></div><div class="metric"><strong>${esc(r.functional||'未记录')}</strong><span>泛函</span></div></div><p class="small muted">备注：${esc(r.source_metadata?.user_note||'未添加')}</p><div class="result-actions">${!state.selected?'<button data-action="SELECT">选择此条</button>':'<span class="tag">当前记录</span>'}<button data-action="NOTE">加备注</button><button data-action="EXPORT">导出结构</button></div><details><summary>记录详情与其他操作</summary><dl class="fields"><dt>来源</dt><dd>si-bulk-relax / vasprun.xml</dd><dt>晶格长度</dt><dd>${r.structure.lattice.a.toFixed(4)} Å</dd><dt>记录 ID</dt><dd>${esc(r.record_id)}</dd></dl><button data-action="DELETE">删除记录</button></details></div>`;}
function extra(c){if(c==='record')return recordCard();if(c==='note')return '<div class="note-choice"><button data-note="保留此结构，待复核">保留此结构，待复核</button><button data-note="用于后续计算">用于后续计算</button></div>';if(c==='delete')return state.pendingDelete?'<div class="note-choice"><button data-action="CONFIRM_DELETE">确认删除</button><button data-action="CANCEL_DELETE">取消</button></div>':'';if(c?.file)return `<div class="note-choice"><button data-download="${esc(c.file)}">↓ ${esc(c.file)}</button><button data-preview="${esc(c.file)}">预览</button></div>`;return '';}
function render(){const c=Cases[state.index],r=state.records.find(r=>r.record_id===state.selected);$('scenarios').innerHTML=Cases.map((x,i)=>`<button data-case="${i}" class="${i===state.index?'active':''}">${x.label}</button>`).join('');$('conversation-title').textContent=c.title;$('scenario-note').textContent=c.note;$('chat-tab').classList.toggle('active',state.view==='chat');$('db-tab').classList.toggle('active',state.view==='db');$('feed').hidden=state.view!=='chat';$('database').hidden=state.view!=='db';
 $('feed').innerHTML=[{role:'assistant',text:c.intro},...state.messages].map(m=>`<div class="message ${m.role}"><div class="avatar">${m.role==='user'?'你':'M'}</div><div class="bubble"><div class="speaker">${m.role==='user'?'你':'MatCreator'}</div><div class="body">${esc(m.text)}${extra(m.card)}</div></div></div>`).join('')+(state.steps.length?'<details class="trace"><summary>查看执行过程 · '+esc(state.last)+'</summary><ol>'+state.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></details>':'');
 $('database').innerHTML='<h2>已有记录 · '+state.records.length+'</h2><p class="small muted">此列表读取当前演示库，不会触发导入。</p>'+recordCard();
 $('selected').innerHTML=r?`<strong>Si · ${r.nsites} 原子</strong><p>${esc(r.source_metadata?.user_note||'尚未添加备注')}</p><button class="quiet" data-action="NOTE">${r.source_metadata?.user_note?'修改备注':'加备注'}</button>`:'<p class="small muted">查询后在这里查看当前记录和备注。</p>';
 $('files').innerHTML=state.files.length?state.files.map(f=>`<button class="file" data-download="${esc(f.name)}">↓ ${esc(f.name)}</button>`).join(''):'<p class="small muted">导出的结构文件会出现在这里。</p>';$('graph').innerHTML='<div class="node"><strong>'+esc(state.last)+'</strong></div>';
 $('state').innerHTML=`<dl class="fields"><dt>库中记录</dt><dd>${state.records.length} 条</dd><dt>最近查询</dt><dd>${state.queryCount===null?'尚未查询':state.queryCount+' 条'}</dd><dt>当前选择</dt><dd>${esc(state.selected||'无')}</dd><dt>备注</dt><dd>${esc(r?.source_metadata?.user_note||'无')}</dd><dt>导出文件</dt><dd>${state.files.length} 个</dd><dt>最近操作</dt><dd>${esc(state.last)}</dd></dl><p>数据流：已有输出 → 保存 → 数据库 → 查询 → 备注或结构文件。</p><p>控制流：操作由按钮触发，查询不会调用保存。</p>`;
 const next=c.steps[state.guide];$('guided').innerHTML=next?`<div class="row"><span class="small muted">体验 ${state.guide+1} / ${c.steps.length}</span><button id="next-step" class="primary">${esc(next[1])} →</button></div>`:'<div class="row"><span class="small green">这一轮已完成，可以继续自由操作。</span><button id="restart" class="quiet">再试一次</button></div>';$('feed').scrollTop=$('feed').scrollHeight;}
function download(name){const f=state.files.find(f=>f.name===name);if(!f)return;const u=URL.createObjectURL(new Blob([f.content],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function modal(title,body){$('modal-root').innerHTML='<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="row spread"><h2>'+esc(title)+'</h2><button id="close-modal">关闭</button></div>'+body+'</section></div>';}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.case!==undefined){state=initial(Number(b.dataset.case));render();return;}if(b.dataset.action){state=transition(state,b.dataset.action);render();return;}if(b.dataset.note){state=transition(state,'SAVE_NOTE',b.dataset.note);render();return;}if(b.dataset.download){download(b.dataset.download);return;}if(b.dataset.preview){const f=state.files.find(f=>f.name===b.dataset.preview);if(f)modal(f.name,'<pre class="file-preview">'+esc(f.content)+'</pre>');return;}if(b.id==='next-step'){state=transition(state,Cases[state.index].steps[state.guide][0]);render();}if(b.id==='reset'||b.id==='restart'){state=initial(state.index);render();}if(b.id==='chat-tab'||b.id==='db-tab'){state.view=b.id==='chat-tab'?'chat':'db';render();}if(b.id==='close-modal')$('modal-root').innerHTML='';if(b.id==='help')modal('这版原型怎么体验','<p>选择顶部流程，再点击底部橙色按钮。也可以直接使用查询、备注和导出按钮，无需输入自然语言。</p><p>默认库中已有一条演示记录。另一个流程从空库开始，演示主动保存已有 VASP 结果。现有主动入口中 query 负责查询，insert 负责保存；自动采集的宿主触发另行定义。</p><p>本版移除了字段导出、JSONL 导出和故障演示入口。结构导出暂以 POSCAR 为候选，下载的 .vasp 文件包含晶格与原子坐标，不包含备注、能量或力。</p><p>数据取自此前 Si 隔离实验；交互、备注、删除和 POSCAR 生成均为内存演示，不代表生产功能已实现。为聚焦主流程，本版遇到重复保存时只提示已存在，不模拟覆盖；实际入口曾观察到重导入覆盖备注，处理策略仍待决定。</p>');});
